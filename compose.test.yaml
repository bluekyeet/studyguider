# The test system (docs/test-system.md): its own database and uploads, on port 8100, reachable from a phone on the same Wi-Fi.
# It never touches the real stack's volumes. AI calls use the same gateway settings as .env.
#   scripts/test-system.sh up
name: studyguider-test

services:
  api:
    build:
      context: ./server
      additional_contexts:
        katex_assets: ./android/app/src/main/assets/katex
    ports:
      - "8100:8000"
    environment:
      DATABASE_URL: postgresql://studyguider:${TEST_POSTGRES_PASSWORD:-local-test-only}@db:5432/studyguider
      UPLOAD_DIR: /data/uploads
      ROUTER_BASE_URL: ${ROUTER_BASE_URL:-}
      ROUTER_API_KEY: ${ROUTER_API_KEY:-}
      STUDYGUIDER_TEST_SYSTEM: "yes"
    volumes:
      - test_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: studyguider
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-local-test-only}
      POSTGRES_DB: studyguider
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyguider -d studyguider"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  test_postgres_data:
  test_uploads:
