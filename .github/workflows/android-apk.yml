name: Build Android APK
# Builds the debug APK so the app can be installed without a local Android toolchain.
# Run it from the Actions tab (Run workflow), or push a tag such as v0.2 to also attach the APK to a GitHub release.
# The APK is signed with the shared debug key, so it is for your own devices, not for publishing in a store.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # only used to attach the APK to a release on a version tag
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Name the APK
        id: apk
        run: |
          name="StudyGuider-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          sha256sum "$name" | tee "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Debug APK built from $GITHUB_SHA. Signed with the shared debug key; install on your own devices."
          gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" "${{ steps.apk.outputs.name }}.sha256" --clobber
