name: Checks
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build Android debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r server/requirements.txt pytest httpx fsrs==6.3.2
      - run: python -m pytest server/tests -q
        env:
          PYTHONPATH: server
      - name: Check resource manager JavaScript
        run: node -e "const fs=require('fs'); new Function(fs.readFileSync('server/manage.html','utf8').match(/<script>([\s\S]*?)<\/script>/)[1])"
      - name: Check manager image cookie authentication
        run: node tests/image-auth-check.cjs
  integration:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: studyguider-ci
      POSTGRES_PASSWORD: ci-disposable-password
      POSTGRES_PASSWORD_URLENCODED: ci-disposable-password
    steps:
      - uses: actions/checkout@v4
      - name: Build and start disposable stack
        run: docker compose -f compose.yaml up -d --build
      - name: Wait for API startup
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Run integration checks
        run: docker compose exec -T -e DISPOSABLE_TEST_DATABASE=yes api python - < server/tests/integration.py
      - name: Check empty-schema initialisation
        run: docker compose -f compose.yaml exec -T api python - < server/tests/fresh_schema_check.py
      - name: Check exam-to-lesson learning cycle
        run: docker compose exec -T api python - < server/tests/learning_cycle_check.py
      - name: Check collated question selection
        run: docker compose -f compose.yaml exec -T api python - < server/tests/collated_selection_check.py
      - name: Check concurrent note edits
        run: docker compose -f compose.yaml exec -T api python - < server/tests/concurrent_note_check.py
      - name: Check concurrent exam saves
        run: docker compose -f compose.yaml exec -T api python - < server/tests/concurrent_exam_check.py
      - name: Check accounts, migration and separation of every account's data
        run: docker compose -f compose.yaml exec -T -e DISPOSABLE_TEST_DATABASE=yes api python - < server/tests/accounts_check.py
      - name: Check the global library (shared read-only, personal additions, per-account search)
        run: docker compose -f compose.yaml exec -T -e DISPOSABLE_TEST_DATABASE=yes api python - < server/tests/library_check.py
      - name: Check rapid exam sessions
        run: docker compose -f compose.yaml exec -T api python - < server/tests/rapid_check.py
      - name: Check unprivileged font rendering
        run: docker compose -f compose.yaml exec -T api python - < server/tests/font_cache_check.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Remove disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
